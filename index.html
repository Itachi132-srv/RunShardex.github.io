<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shardex Game & Store</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap');

:root {
    --bg:#05040a;
    --card:#0f0a1c;
    --main-color:#8b5cf6;
    --accent-color:#a855f7;
    --cyan:#06b6d4;
    --gradient-btn: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
    --light:#c4aaff;
    --text:#f5f3ff;
    --muted:#8b839e;
    --border:#221838;
}

/* RARITY COLORS */
.rarity-common { color: #b0b0b0; border-color: #b0b0b0; }
.rarity-uncommon { color: #4ade80; border-color: #4ade80; }
.rarity-rare { color: #60a5fa; border-color: #60a5fa; }
.rarity-legendary { color: #f59e0b; border-color: #f59e0b; text-shadow: 0 0 8px rgba(245, 158, 11, 0.5); }
.rarity-secret {
    background: linear-gradient(90deg, #ff007f, #00f2fe, #7928ca);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
    text-shadow: 0 0 10px rgba(0,242,254,0.6);
}

/* RAINBOW ANIMATION FOR LIMITED SKIN */
@keyframes rainbowGlow {
    0% { filter: hue-rotate(0deg) drop-shadow(0 0 8px #ff0000); }
    50% { filter: hue-rotate(180deg) drop-shadow(0 0 12px #00ffcc); }
    100% { filter: hue-rotate(360deg) drop-shadow(0 0 8px #ff0000); }
}
.rainbow-animated {
    animation: rainbowGlow 3s infinite linear;
    font-weight: 800;
    letter-spacing: 1px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    background:var(--bg);
    color:var(--text);
    font-family:'Poppins',sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 7%;
    background:rgba(15, 10, 28, 0.8);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:10;
}

.logo {
    font:900 24px 'Orbitron',sans-serif;
    color:var(--light);
    cursor: pointer;
    letter-spacing: 1px;
}
.logo span {color:var(--cyan);}

.header-right { display:flex; align-items:center; gap:16px; }

.shard-display {
    background: rgba(139, 92, 246, 0.15);
    border: 1px solid var(--main-color);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: #38bdf8;
    display: flex;
    align-items: center;
    gap: 6px;
}

button { cursor:pointer; font-family:inherit; }

.cart-btn-main, .action-btn {
    background: var(--gradient-btn);
    color:white;
    border:0;
    border-radius:10px;
    padding:10px 18px;
    font-weight:700;
    font-size: 13px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
}

.cart-btn-main:hover, .action-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
}

.action-btn.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--light);
    box-shadow: none;
}
.action-btn.secondary:hover {
    border-color: var(--main-color);
    background: rgba(139, 92, 246, 0.1);
}

.page { display: none; flex: 1; }
.page.active { display: block; }

.back-bar { padding: 15px 7% 0; }
.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--light);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
}

/* HERO SECTION */
.hero { text-align:center; padding:60px 20px 30px; }
.hero h1 {
    font:900 clamp(32px,5vw,56px)/1.2 'Orbitron',sans-serif;
    margin-bottom:14px;
    background: linear-gradient(180deg, #ffffff 0%, #c4aaff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.hero p { max-width:600px; margin:auto; color:var(--muted); font-size:14px; }

.home-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 25px; flex-wrap: wrap; }

/* GAME CANVAS CONTAINER */
.game-container {
    max-width: 800px;
    margin: 20px auto;
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid var(--border);
    box-shadow: 0 0 30px rgba(139, 92, 246, 0.2);
    background: #000;
}

canvas { display: block; width: 100%; height: 400px; }

/* SKINS STORE GRID */
.section { padding:30px 7%; }
.section h2 { font:800 28px 'Orbitron',sans-serif; margin-bottom:8px; color: var(--light); }
.subtitle { color:var(--muted); font-size:14px; margin-bottom:25px; }

.skins-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.skin-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    position: relative;
    transition: all 0.3s ease;
}

.skin-card:hover {
    transform: translateY(-5px);
    border-color: var(--main-color);
    box-shadow: 0 10px 25px rgba(139, 92, 246, 0.25);
}

.skin-preview {
    width: 70px;
    height: 70px;
    margin: 10px auto;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.rarity-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    border: 1px solid;
    margin-bottom: 8px;
    text-transform: uppercase;
}

.skin-card h4 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.skin-price { color: var(--cyan); font-weight: 700; margin: 10px 0; font-size: 15px; }

/* MODALS */
.modal-overlay {
    display:none; position:fixed; inset:0; z-index:100;
    background:rgba(0,0,0,0.85); backdrop-filter: blur(6px);
    align-items:center; justify-content:center; padding:15px;
}
.modal-overlay.show { display:flex; }

.modal-box {
    width:100%; max-width:480px; max-height:90vh; overflow-y:auto;
    background:var(--card); border:1px solid var(--border);
    border-radius:20px; padding:25px; box-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
}

.modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:15px; }
.modal-head h2 { font:700 20px 'Orbitron',sans-serif; color: var(--light); }
.close-modal { color:var(--text); background:transparent; border:0; font-size:25px; }

/* COOL UNLOCK ANIMATION POPUP */
@keyframes unlockPop {
    0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
    50% { transform: scale(1.1) rotate(5deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

.unlock-box {
    text-align: center;
    animation: unlockPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

.unlock-icon {
    width: 100px;
    height: 100px;
    margin: 0 auto 15px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    box-shadow: 0 0 30px var(--main-color);
}

footer {
    text-align:center; color:var(--muted); padding:25px 15px;
    border-top:1px solid var(--border); font-size:13px; margin-top: auto;
    display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
}
footer a { color: var(--cyan); text-decoration: none; font-weight: 600; }
</style>
</head>

<body>

<header>
    <div class="logo" onclick="navigateTo('home')">SHARDEX <span>GAME</span></div>
    <div class="header-right">
        <div class="shard-display">💎 <span id="shardBalance">0</span> Shards</div>
        <button class="cart-btn-main" onclick="openModal('shopModal')">Skin Shop 🛒</button>
    </div>
</header>

<!-- HOME PAGE -->
<main id="homePage" class="page active">
    <section class="hero">
        <h1>PLAY &amp; UNLOCK SKINS</h1>
        <p>Defeat enemies to collect Shards: <strong>Red (49)</strong> | <strong>Brown (99)</strong> | <strong>Black (149)</strong></p>
        
        <div class="home-buttons">
            <button class="action-btn" onclick="startGame()">Start Game 🎮</button>
            <button class="action-btn secondary" onclick="openModal('shopModal')">Skin Shop</button>
            <button class="action-btn secondary" onclick="openModal('settingsModal')">⚙️ Admin / Settings</button>
        </div>
    </section>

    <!-- GAME CANVAS CONTAINER -->
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>
</main>

<footer>
    <span>© 2026 Shardex Game. All rights reserved.</span>
    <a href="https://discord.gg/yourserver" target="_blank">🎮 Join Discord</a>
</footer>

<!-- SKIN SHOP MODAL -->
<div class="modal-overlay" id="shopModal" onclick="overlayClick(event, 'shopModal')">
    <div class="modal-box" style="max-width: 750px;">
        <div class="modal-head">
            <h2>Skin Shop</h2>
            <button class="close-modal" onclick="closeModal('shopModal')">×</button>
        </div>
        
        <div style="margin-bottom: 15px; font-size: 13px; color: var(--muted);">
            Redeem Code (For Secret Blue Skin):
            <div style="display: flex; gap: 8px; margin-top: 5px;">
                <input type="text" id="redeemCodeInput" placeholder="Enter Code..." style="flex: 1; background: var(--bg); color: #fff; border: 1px solid var(--border); padding: 8px; border-radius: 8px;">
                <button class="action-btn" onclick="redeemCode()">Redeem</button>
            </div>
        </div>

        <div class="skins-grid" id="skinsContainer"></div>
    </div>
</div>

<!-- COOL SKIN UNLOCK POPUP MODAL -->
<div class="modal-overlay" id="unlockModal">
    <div class="modal-box unlock-box">
        <div class="unlock-icon" id="unlockSkinPreview">💎</div>
        <h3 style="font-size: 22px; font-family: 'Orbitron'; margin-bottom: 5px;" id="unlockSkinName">Skin Unlocked!</h3>
        <p style="color: var(--muted); font-size: 13px; margin-bottom: 20px;" id="unlockSkinRarity">Rarity: Legendary</p>
        <button class="action-btn" onclick="closeModal('unlockModal')">Equip &amp; Continue</button>
    </div>
</div>

<!-- SETTINGS & ADMIN CODE MODAL -->
<div class="modal-overlay" id="settingsModal" onclick="overlayClick(event, 'settingsModal')">
    <div class="modal-box">
        <div class="modal-head">
            <h2>Game Settings</h2>
            <button class="close-modal" onclick="closeModal('settingsModal')">×</button>
        </div>
        <div style="display: grid; gap: 15px; font-size: 13px;">
            <div>
                <label style="color: var(--muted); display: block; margin-bottom: 5px;">Enter Admin Code:</label>
                <div style="display: flex; gap: 8px;">
                    <input type="password" id="adminCodeInput" placeholder="Enter Admin Code" style="flex:1; background: var(--bg); color: #fff; border: 1px solid var(--border); padding: 10px; border-radius: 8px;">
                    <button class="action-btn" onclick="applyAdminCode()">Submit</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
"use strict";

/* GAME & SKINS DATA */
let shards = Number(localStorage.getItem('shardex_shards')) || 500;
let unlockedSkins = JSON.parse(localStorage.getItem('shardex_unlocked_skins')) || ['default'];
let equippedSkin = localStorage.getItem('shardex_equipped_skin') || 'default';

const SKINS_DATA = [
    { id: 'default', name: 'Standard Purple', rarity: 'common', price: 0, color: '#8b5cf6' },
    { id: 'amethyst_v1', name: 'Amethyst Striker', rarity: 'legendary', price: 1999, color: '#9333ea' },
    { id: 'amethyst_v2', name: 'Amethyst Prime', rarity: 'legendary', price: 2499, color: '#a855f7' },
    { id: 'orange_blaze', name: 'Orange Inferno', rarity: 'uncommon', price: 1499, color: '#f97316' },
    { id: 'dark_velvet', name: 'Velvet Night', rarity: 'rare', price: 2999, color: '#4c1d95' },
    { id: 'secret_blue', name: 'Secret Cyan', rarity: 'secret', price: -1, color: '#00f2fe', isCodeOnly: true, code: 'SECRETBLUE2026' },
    { id: 'rainbow_god', name: 'Rainbow Celestial', rarity: 'legendary', price: 0, color: 'linear-gradient(45deg, red, yellow, green, cyan, blue, magenta)', comingSoon: true }
];

function updateShardDisplay() {
    document.getElementById("shardBalance").textContent = shards.toLocaleString();
    localStorage.setItem('shardex_shards', shards);
}

function saveSkinData() {
    localStorage.setItem('shardex_unlocked_skins', JSON.stringify(unlockedSkins));
    localStorage.setItem('shardex_equipped_skin', equippedSkin);
}

/* RENDER SKINS IN SHOP */
function renderShop() {
    const container = document.getElementById("skinsContainer");
    container.innerHTML = SKINS_DATA.map(skin => {
        const isUnlocked = unlockedSkins.includes(skin.id);
        const isEquipped = equippedSkin === skin.id;

        let actionBtnHTML = '';
        if (skin.comingSoon) {
            actionBtnHTML = `<button class="action-btn secondary" disabled style="opacity: 0.6; width: 100%;">Coming Soon</button>`;
        } else if (isUnlocked) {
            actionBtnHTML = `<button class="action-btn ${isEquipped ? '' : 'secondary'}" style="width: 100%;" onclick="equipSkin('${skin.id}')">${isEquipped ? 'Equipped ✓' : 'Equip'}</button>`;
        } else if (skin.isCodeOnly) {
            actionBtnHTML = `<button class="action-btn secondary" disabled style="width: 100%;">Code Required</button>`;
        } else {
            actionBtnHTML = `<button class="action-btn" style="width: 100%;" onclick="buySkin('${skin.id}')">Buy (${skin.price} 💎)</button>`;
        }

        let rarityClass = `rarity-${skin.rarity}`;
        let extraAnimationClass = (skin.id === 'secret_blue') ? 'rainbow-animated' : '';

        return `
            <div class="skin-card">
                <span class="rarity-tag ${rarityClass} ${extraAnimationClass}">${skin.rarity}</span>
                <div class="skin-preview" style="background: ${skin.color}">👤</div>
                <h4>${skin.name}</h4>
                <div class="skin-price">${skin.comingSoon ? 'Locked' : (skin.price > 0 ? skin.price + ' Shards' : 'Exclusive')}</div>
                ${actionBtnHTML}
            </div>
        `;
    }).join("");
}

function buySkin(id) {
    const skin = SKINS_DATA.find(s => s.id === id);
    if (!skin || shards < skin.price) {
        alert("Not enough Shards!");
        return;
    }

    shards -= skin.price;
    unlockedSkins.push(id);
    equippedSkin = id;
    updateShardDisplay();
    saveSkinData();
    renderShop();

    // Trigger Cool Unlock Pop Modal
    document.getElementById("unlockSkinName").textContent = skin.name;
    document.getElementById("unlockSkinRarity").textContent = "Rarity: " + skin.rarity.toUpperCase();
    document.getElementById("unlockSkinPreview").style.background = skin.color;
    openModal("unlockModal");
}

function equipSkin(id) {
    equippedSkin = id;
    saveSkinData();
    renderShop();
}

function redeemCode() {
    const code = document.getElementById("redeemCodeInput").value.trim().toUpperCase();
    const secretSkin = SKINS_DATA.find(s => s.id === 'secret_blue');

    if (code === secretSkin.code) {
        if (!unlockedSkins.includes(secretSkin.id)) {
            unlockedSkins.push(secretSkin.id);
            equippedSkin = secretSkin.id;
            saveSkinData();
            renderShop();
            alert("Congratulations! Secret Cyan Skin Unlocked!");
        } else {
            alert("Already Unlocked!");
        }
    } else {
        alert("Invalid Code!");
    }
}

/* ADMIN CODE SYSTEM */
function applyAdminCode() {
    const code = document.getElementById("adminCodeInput").value.trim();
    if (code === "Shardexadmin") {
        shards += 999999;
        SKINS_DATA.forEach(skin => {
            if (!skin.isCodeOnly && !skin.comingSoon && !unlockedSkins.includes(skin.id)) {
                unlockedSkins.push(skin.id);
            }
        });
        updateShardDisplay();
        saveSkinData();
        renderShop();
        closeModal("settingsModal");
        alert("Admin Mode Activated! Unlimited Shards & All Standard/Amethyst Skins Unlocked!");
    } else {
        alert("Incorrect Admin Code!");
    }
}

/* CANVAS GAME ENGINE WITH SLIME JUMP & PARTICLE DEATH */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let player = {
    x: 50, y: 300, width: 35, height: 35,
    vy: 0, jumping: false, stretchY: 1, stretchX: 1
};

let enemies = [];
let particles = [];
let gameRunning = false;

function startGame() {
    gameRunning = true;
    player.y = 300;
    player.vy = 0;
    enemies = [];
    particles = [];
    spawnEnemy();
    requestAnimationFrame(gameLoop);
}

function spawnEnemy() {
    if (!gameRunning) return;
    const types = [
        { color: 'red', shards: 49, speed: 4 },
        { color: '#78350f', shards: 99, speed: 5 }, // Brown
        { color: '#111827', shards: 149, speed: 6 }  // Black
    ];
    const type = types[Math.floor(Math.random() * types.length)];
    enemies.push({ x: canvas.width, y: 310, width: 30, height: 30, ...type });
    setTimeout(spawnEnemy, Math.random() * 2000 + 1500);
}

window.addEventListener("keydown", e => {
    if ((e.code === "Space" || e.code === "ArrowUp") && !player.jumping && gameRunning) {
        player.vy = -13;
        player.jumping = true;
        // Slime Stretch Effect
        player.stretchY = 1.4;
        player.stretchX = 0.7;
    }
});

function createDeathParticles(x, y, color) {
    for (let i = 0; i < 20; i++) {
        particles.push({
            x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
            life: 30, color
        });
    }
}

function gameLoop() {
    if (!gameRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Ground
    ctx.fillStyle = "#1e1b2e";
    ctx.fillRect(0, 340, canvas.width, 60);

    // Player Gravity & Slime Animation Recovery
    player.vy += 0.7;
    player.y += player.vy;
    player.stretchX += (1 - player.stretchX) * 0.1;
    player.stretchY += (1 - player.stretchY) * 0.1;

    if (player.y >= 305) {
        player.y = 305;
        player.jumping = false;
        player.vy = 0;
    }

    // Draw Player
    const currentSkin = SKINS_DATA.find(s => s.id === equippedSkin) || SKINS_DATA[0];
    ctx.save();
    ctx.fillStyle = currentSkin.color;
    ctx.translate(player.x + player.width/2, player.y + player.height/2);
    ctx.scale(player.stretchX, player.stretchY);
    ctx.fillRect(-player.width/2, -player.height/2, player.width, player.height);
    ctx.restore();

    // Draw Enemies & Collision
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.x -= e.speed;
        ctx.fillStyle = e.color;
        ctx.fillRect(e.x, e.y, e.width, e.height);

        // Player Stomp Enemy Check
        if (
            player.x < e.x + e.width &&
            player.x + player.width > e.x &&
            player.y < e.y + e.height &&
            player.y + player.height > e.y
        ) {
            if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 10) {
                // Defeated Enemy!
                shards += e.shards;
                updateShardDisplay();
                createDeathParticles(e.x, e.y, e.color);
                enemies.splice(i, 1);
                player.vy = -8; // Bounce off
            } else {
                // Game Over Effect
                createDeathParticles(player.x, player.y, currentSkin.color);
                gameRunning = false;
                setTimeout(() => alert("Game Over! Try Again."), 100);
                return;
            }
        }
    }

    // Render Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
        if (p.life <= 0) particles.splice(i, 1);
    }

    requestAnimationFrame(gameLoop);
}

/* MODAL HELPERS */
function openModal(id) { document.getElementById(id).classList.add("show"); }
function closeModal(id) { document.getElementById(id).classList.remove("show"); }
function overlayClick(e, id) { if (e.target.id === id) closeModal(id); }
function navigateTo(pageId) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(pageId + "Page").classList.add("active");
}

/* INITIAL SETUP */
updateShardDisplay();
renderShop();
</script>

</body>
</html>
